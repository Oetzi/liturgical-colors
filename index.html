<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liturgical Colors</title>
<meta name="description" content="What to wear to Mass today: the liturgical color, celebration, readings and saint for any date.">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
<!-- Link previews. og:image must be changed to a full https:// address once the site has a home. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Liturgical Colors">
<meta property="og:description" content="What to wear to Mass today: the liturgical color, celebration, readings and saint for any date.">
<meta property="og:image" content="og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <header class="top">
    <a id="supportTop" class="chip" href="https://ko-fi.com/liturgicalcolors" target="_blank" rel="noopener"></a>
    <button id="langBtn" class="chip"></button>
    <h1 id="title"></h1>
    <p id="tag" class="tag"></p>
  </header>

  <nav class="datebar">
    <button id="prev" class="round">&#8249;</button>
    <label class="datepick">
      <span id="dayword" class="dayword"></span>
      <span id="datetext" class="datetext"></span>
      <input id="date" type="date">
    </label>
    <button id="next" class="round">&#8250;</button>
  </nav>
  <p class="todayrow"><button id="today" class="link" hidden></button></p>

  <section id="hero" class="hero" aria-live="polite"></section>

  <section class="card">
    <h2 id="readingsTitle"></h2>
    <div id="readings"></div>
  </section>

  <section class="card">
    <h2 id="saintTitle"></h2>
    <div id="saints"></div>
  </section>

  <section>
    <h2 id="weekTitle" class="plain"></h2>
    <div id="week" class="week"></div>
  </section>

  <details id="monthFold" class="card fold">
    <summary><h2 id="monthTitle"></h2><span id="monthSub"></span></summary>
    <div class="monthnav">
      <button id="prevMonth" class="round small">&#8249;</button>
      <b id="monthName"></b>
      <button id="nextMonth" class="round small">&#8250;</button>
    </div>
    <div id="month" class="month"></div>
  </details>

  <details class="card fold">
    <summary><h2 id="meaningsTitle"></h2><span id="meaningsSub"></span></summary>
    <ul id="meanings" class="colors"></ul>
    <p id="wearNote" class="fine"></p>
  </details>

  <details class="card fold">
    <summary><h2 id="historyTitle"></h2><span id="historySub"></span></summary>
    <ol id="history" class="history"></ol>
    <p id="fine" class="fine"></p>
  </details>

  <details class="card fold">
    <summary><h2 id="settingsTitle"></h2><span id="settingsSub"></span></summary>
    <label class="field"><span id="langLabel"></span>
      <select id="langSel"><option value="en">English</option><option value="es">Español</option></select>
    </label>
    <label class="field"><span id="ascLabel"></span>
      <select id="ascSel"><option value="sun"></option><option value="thu"></option></select>
    </label>
  </details>

  <a id="supportBottom" class="support" href="https://ko-fi.com/liturgicalcolors" target="_blank" rel="noopener"></a>
  <p id="supportFine" class="fine center"></p>
</main>

<dialog id="saintDialog">
  <div id="saintBody"></div>
  <button id="saintClose" class="btnplain"></button>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>

<script src="saints.js"></script>
<script src="calendar.js"></script>
<script src="i18n.js"></script>
<script src="bios.js"></script>
<script src="readings-2027.js"></script>
<script src="app.js"></script>
</body>
</html>
